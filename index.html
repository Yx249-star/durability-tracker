<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Durability Action Tracker (Public)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f3f1ec;
    --surface:#ffffff;
    --surface-2:#faf8f3;
    --ink:#20241f;
    --sub:#6b6f66;
    --border:#e2ded2;
    --accent:#c65a1e;
    --accent-ink:#ffffff;
    --ok:#2f7a4f;
    --ok-bg:#e8f3ea;
    --warn:#b9790a;
    --warn-bg:#fbf0dc;
    --bad:#b3311f;
    --bad-bg:#fbe7e2;
    --hold:#5b5f8a;
    --hold-bg:#eaeafa;
    --closed:#8b8d84;
    --closed-bg:#eeece3;
    --shadow: 0 1px 2px rgba(30,28,20,.06), 0 8px 24px rgba(30,28,20,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181a;
      --surface:#1e2123;
      --surface-2:#232629;
      --ink:#eceae4;
      --sub:#9a9d96;
      --border:#33362f;
      --accent:#e0793a;
      --accent-ink:#1a1204;
      --ok:#5fbf85;
      --ok-bg:#173023;
      --warn:#e0ab4a;
      --warn-bg:#332a13;
      --bad:#ec6a58;
      --bad-bg:#3a1c17;
      --hold:#9ea3e6;
      --hold-bg:#232349;
      --closed:#8f9289;
      --closed-bg:#2a2c27;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181a; --surface:#1e2123; --surface-2:#232629; --ink:#eceae4; --sub:#9a9d96;
    --border:#33362f; --accent:#e0793a; --accent-ink:#1a1204;
    --ok:#5fbf85; --ok-bg:#173023; --warn:#e0ab4a; --warn-bg:#332a13;
    --bad:#ec6a58; --bad-bg:#3a1c17; --hold:#9ea3e6; --hold-bg:#232349;
    --closed:#8f9289; --closed-bg:#2a2c27;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    padding-block: 28px 60px;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding-inline:20px; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  .tab{ font-variant-numeric: tabular-nums; }

  header.top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    flex-wrap:wrap; margin-bottom:20px;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
    font-weight:600; margin:0 0 4px;
  }
  h1{ margin:0; font-size:26px; font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
  .meta{ color:var(--sub); font-size:13px; margin-top:6px; max-width:60ch; }
  .conn{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub);
    background:var(--surface); border:1px solid var(--border); border-radius:99px;
    padding:6px 12px; box-shadow:var(--shadow); white-space:nowrap;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
  .dot.off{ background:var(--sub); }

  .checklist{
    background:var(--surface); border:1px solid var(--accent); border-radius:14px;
    padding:16px 20px; box-shadow:var(--shadow); margin-bottom:20px;
  }
  .checklist h2{ margin:0 0 4px; font-size:15px; font-weight:700; }
  .checklist .sub{ font-size:12px; color:var(--sub); margin-bottom:12px; }
  .checklist ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .checklist li{
    display:flex; align-items:flex-start; gap:9px; font-size:13.5px; line-height:1.5;
    padding:8px 10px; border-radius:9px; background:var(--surface-2);
  }
  .checklist li.action{ background:var(--warn-bg); color:var(--warn); font-weight:600; }
  .checklist li.action b{ color:var(--warn); }
  .checklist li.done{ color:var(--sub); }
  .checklist li .ico{ flex:none; font-size:15px; line-height:1.3; }
  .checklist li .refs{ font-family:"IBM Plex Mono", monospace; }

  .week-agenda{
    display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:18px;
  }
  @media (max-width:760px){ .week-agenda{ grid-template-columns:repeat(4,1fr); } }
  @media (max-width:460px){ .week-agenda{ grid-template-columns:repeat(2,1fr); } }
  .day{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 10px 12px; box-shadow:var(--shadow); min-height:96px;
  }
  .day.weekend{ background:var(--surface-2); }
  .day.today{ border-color:var(--accent); border-width:2px; padding:9px 9px 11px; }
  .day .dlabel{ font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; display:flex; justify-content:space-between; }
  .day.today .dlabel{ color:var(--accent); font-weight:700; }
  .day .dnum{ font-size:19px; font-weight:700; margin:2px 0 6px; font-variant-numeric: tabular-nums; }
  .day .chips{ display:flex; flex-direction:column; gap:3px; }
  .day .chip{
    font-family:"IBM Plex Mono", monospace; font-size:10.5px; font-weight:600;
    border-radius:5px; padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .day .chip.bad{ background:var(--bad-bg); color:var(--bad); }
  .day .chip.warn{ background:var(--warn-bg); color:var(--warn); }
  .day .chip.ok{ background:var(--ok-bg); color:var(--ok); }
  .day .none{ font-size:11px; color:var(--sub); opacity:.6; }

  .stats{
    display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:22px;
  }
  @media (max-width:820px){ .stats{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:480px){ .stats{ grid-template-columns:repeat(2,1fr); } }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; box-shadow:var(--shadow);
  }
  .stat b{ display:block; font-size:24px; font-weight:700; line-height:1.1; }
  .stat span{ font-size:11.5px; color:var(--sub); text-transform:uppercase; letter-spacing:.04em; }
  .stat.bad b{ color:var(--bad); }
  .stat.warn b{ color:var(--warn); }
  .stat.ok b{ color:var(--ok); }

  .briefing{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; box-shadow:var(--shadow); margin-bottom:26px;
  }
  .briefing-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
  .briefing-head h2{ margin:0; font-size:15px; font-weight:700; }
  .briefing-head .sub{ font-size:12px; color:var(--sub); }
  button.copy{
    font: inherit; font-size:12.5px; font-weight:600; color:var(--accent-ink);
    background:var(--accent); border:none; border-radius:8px; padding:7px 14px;
    cursor:pointer;
  }
  button.copy:active{ transform:translateY(1px); }
  button.copy:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  pre.brief-text{
    white-space:pre-wrap; font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12.5px; line-height:1.65; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; margin:0; color:var(--ink);
  }

  .project{ margin-bottom:34px; }
  .project-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap;
  }
  .project-head h2{ margin:0; font-size:18px; font-weight:700; }
  .project-head .count{ font-size:12.5px; color:var(--sub); }

  .group{ margin-bottom:14px; }
  .group-title{
    display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600;
    text-transform:uppercase; letter-spacing:.05em; color:var(--sub); margin:0 0 8px;
  }
  .group-title .n{
    font-family:"IBM Plex Mono", monospace; background:var(--surface-2); border:1px solid var(--border);
    border-radius:99px; padding:1px 8px; font-size:11px; color:var(--ink);
  }
  .group-title.bad{ color:var(--bad); }
  .group-title.warn{ color:var(--warn); }

  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; box-shadow:var(--shadow);
    display:grid; grid-template-columns: 64px 1fr auto; gap:12px; align-items:start;
  }
  @media (max-width:640px){ .task{ grid-template-columns: 1fr; } }
  .task .ref{ font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:13px; color:var(--sub); padding-top:2px; }
  .task .body{ min-width:0; }
  .task .row1{ display:flex; gap:8px; flex-wrap:wrap; align-items:baseline; margin-bottom:3px; }
  .fn-tag{
    font-size:11px; font-weight:600; color:var(--sub); background:var(--surface-2);
    border:1px solid var(--border); border-radius:6px; padding:1px 7px; white-space:nowrap;
  }
  .fn-tag.proj-tag{ color:var(--accent); border-color:var(--accent); background:transparent; }
  .org-block{ margin:0 0 26px 4px; padding-left:14px; border-left:3px solid var(--accent); }
  .org-head{
    display:flex; align-items:baseline; gap:10px; margin:0 0 14px; flex-wrap:wrap;
  }
  .org-head h3{ margin:0; font-size:16px; font-weight:700; color:var(--accent); }
  .org-head .count{ font-size:12.5px; color:var(--sub); }
  .owner-block{ margin-bottom:22px; padding-left:14px; border-left:3px solid var(--border); }
  .owner-title{
    display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--ink);
    margin:0 0 10px;
  }
  .owner-title .n{
    font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:11px; color:var(--sub);
    background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:1px 9px;
  }
  .owner-title .n.bad{ color:var(--bad); background:var(--bad-bg); border-color:var(--bad); }
  .task .desc{ font-size:14px; font-weight:600; line-height:1.35; text-wrap:balance; }
  .task .desc-en{ font-size:11.5px; color:var(--sub); font-style:italic; margin-top:1px; line-height:1.4; }
  .task .action{ font-size:13px; color:var(--sub); line-height:1.5; margin-top:3px; }
  .task .action-en{ font-size:11px; color:var(--sub); opacity:.75; font-style:italic; line-height:1.4; margin-top:2px; }
  .comments-en{ font-size:11px; color:var(--sub); opacity:.75; font-style:italic; margin-top:4px; line-height:1.4; }
  .task .footer{ display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--sub); }
  .task .footer b{ color:var(--accent); font-weight:700; }
  .comment-box{
    margin-top:8px; width:100%; font: inherit; font-size:12.5px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:7px 9px; resize:vertical; min-height:32px;
  }
  .task .side{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .due{
    font-family:"IBM Plex Mono", monospace; font-size:12px; font-weight:600;
    padding:3px 9px; border-radius:99px; white-space:nowrap;
  }
  .due.bad{ background:var(--bad); color:#fff; font-weight:700; box-shadow:0 0 0 1px var(--bad); }
  .due.warn{ background:var(--warn-bg); color:var(--warn); }
  .due.ok{ background:var(--ok-bg); color:var(--ok); }
  .due.closed{ background:var(--closed-bg); color:var(--closed); }
  input.due-input{
    font: inherit; font-size:11.5px; color:var(--sub);
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    padding:3px 6px; width:118px;
  }
  input.reason-input{
    font: inherit; font-size:11.5px; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    padding:3px 6px; width:118px;
  }
  .changelog{
    margin-top:8px; padding:8px 10px; background:var(--warn-bg); border:1px solid var(--warn);
    border-radius:8px;
  }
  .changelog .cl-title{ margin:0 0 5px; font-size:11px; font-weight:700; color:var(--warn); }
  .changelog ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .changelog li{ font-size:11.5px; color:var(--ink); display:flex; flex-wrap:wrap; gap:6px; align-items:baseline; }
  .changelog .cl-date{ font-family:"IBM Plex Mono", monospace; color:var(--sub); }
  .changelog .cl-arrow{ font-weight:600; }
  .changelog .cl-reason{ color:var(--sub); font-style:italic; }
  select.status-select{
    font: inherit; font-size:12px; font-weight:600; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
    padding:4px 8px;
  }

  details.closed-group summary{
    cursor:pointer; font-size:12.5px; color:var(--sub); font-weight:600;
    padding:6px 2px;
  }
  details.closed-group .task-list{ margin-top:8px; }
  .task.is-closed{ opacity:.62; }
  .task.is-closed .desc{ text-decoration: line-through; text-decoration-thickness:1px; text-decoration-color:var(--border); }

  footer.note{
    margin-top:30px; font-size:11.5px; color:var(--sub); border-top:1px solid var(--border);
    padding-top:14px; line-height:1.6;
  }
  .empty{ color:var(--sub); font-size:13px; padding:16px 0; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Oyu Tolgoi &middot; RT&amp;OT Durability Workshop</p>
      <h1>Action Tracker — Battery Swap &amp; Tonly BEHT</h1>
      <p class="meta">公开只读快照——跟踪到期节点、延期记录、周度完成情况。如需编辑状态/备注，请使用内部协作版本。</p>
    </div>
    <div class="conn"><span class="dot" id="staticDot"></span><span id="staticLabel"></span></div>
  </header>

  <div class="checklist" id="dailyChecklist"></div>

  <div class="week-agenda" id="weekAgenda"></div>

  <div class="stats" id="stats"></div>

  <div class="briefing">
    <div class="briefing-head">
      <div>
        <h2 id="briefTitle">今日播报</h2>
        <div class="sub" id="briefDate"></div>
      </div>
      <button class="copy" id="copyBtn">复制播报文案</button>
    </div>
    <pre class="brief-text" id="briefText">加载中…</pre>
  </div>

  <div class="briefing">
    <div class="briefing-head">
      <div>
        <h2>周报文案</h2>
        <div class="sub" id="weekRangeLabel"></div>
      </div>
      <button class="copy" id="copyWeekBtn">复制周报文案</button>
    </div>
    <pre class="brief-text" id="weekText">加载中…</pre>
  </div>

  <div id="projects"></div>

  <footer class="note">
    数据源：Durability Workshop Action Lists.xlsx（力拓 OT 蒙古电站，2026-09 workshop 督办清单）。这是某一时刻的静态快照，不会自动更新；到期判断按浏览器本机日期计算；如需最新数据或要修改状态/备注，请联系维护人重新生成。
  </footer>
</div>

<script>
(function(){
  const PROJECTS = ["Battery Swapping Station", "Tonly DTE145 BEHT"];
  const PROJECT_LABELS = {
    "Battery Swapping Station": "换电站（Battery Swapping Station）",
    "Tonly DTE145 BEHT": "Tonly 卡车（Tonly DTE145 BEHT）"
  };
  const STATUS_OPTIONS = ["Open", "On hold", "Closed"];
  const STATUS_LABELS = {"Open":"进行中（Open）", "On hold":"搁置中（On hold）", "Closed":"已完成（Closed）"};
  const FUNCTION_LABELS = {
    "MCC":"马达控制中心（MCC）", "Parts Supply":"备件供应（Parts Supply）", "Performance":"性能（Performance）",
    "Procedures":"作业规程（Procedures）", "Static Charger":"静态充电桩（Static Charger）", "Tactics":"维护策略（Tactics）",
    "Documentation":"文档资料（Documentation）", "Trucks":"卡车（Trucks）", "Tyres":"轮胎（Tyres）"
  };
  function fnLabel(f){ return FUNCTION_LABELS[f] || f || '—'; }
  function statusLabel(s){ return STATUS_LABELS[s] || s || '—'; }
  function projectLabel(p){ return PROJECT_LABELS[p] || p || '—'; }

  // owner -> organization, confirmed by user against the workshop attendee list
  const OT_OWNERS = ["OT Site Leads","Zhiwen Liu","Samantha Coley","Zolbayar Enkhbat","REs",
    "Richard Ganza","Bayarbold Samdanpurev & REs","OT (RGanza)","OT REs","OT REs & Planner"];
  const QY_OWNERS = ["Guojun Zhang","Du Jinpeng","Chengyu Wu","Mr Gao","Tonly","Stanley Shi"];
  const ORGS = ["OT","QY","NOTE"];
  const ORG_LABELS = {"OT":"力拓（OT）","QY":"启源","NOTE":"仅备案（Note Only）"};
  function ownerOrg(owner){
    if(!owner) return 'OT';
    if(owner === 'Note Only') return 'NOTE';
    if(QY_OWNERS.includes(owner)) return 'QY';
    if(OT_OWNERS.includes(owner)) return 'OT';
    return 'OT';
  }

  function toDateOnly(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function todayDateOnly(){ return toDateOnly(new Date()); }
  function parseISO(s){ if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
  function fmt(d){ if(!d) return '—'; return d.toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit'}); }
  function daysBetween(a,b){ return Math.round((toDateOnly(b) - toDateOnly(a)) / 86400000); }

  function dueBucket(task){
    if(task.status === 'Closed') return 'closed';
    const due = parseISO(task.dueDate);
    if(!due) return 'ok';
    const diff = daysBetween(todayDateOnly(), due);
    if(diff < 0) return 'bad';
    if(diff <= 3) return 'warn';
    return 'ok';
  }
  function dueLabel(task){
    const due = parseISO(task.dueDate);
    if(!due) return '无日期';
    const diff = daysBetween(todayDateOnly(), due);
    const base = fmt(due);
    if(task.status === 'Closed') return base + ' 已完成';
    if(diff < 0) return base + '（逾期 ' + (-diff) + ' 天）';
    if(diff === 0) return base + '（今日到期）';
    if(diff === 1) return base + '（明日到期）';
    return base + '（' + diff + ' 天后）';
  }

  function biDesc(t){
    return t.description + (t.descriptionEn ? '／' + t.descriptionEn : '');
  }

  let allTasks = [];

  function renderStats(){
    const el = document.getElementById('stats');
    const open = allTasks.filter(t => t.status === 'Open');
    const hold = allTasks.filter(t => t.status === 'On hold');
    const closed = allTasks.filter(t => t.status === 'Closed');
    const overdue = allTasks.filter(t => t.status !== 'Closed' && dueBucket(t) === 'bad');
    const dueSoon = allTasks.filter(t => t.status !== 'Closed' && dueBucket(t) === 'warn');
    const tiles = [
      ['总任务', allTasks.length, ''],
      ['进行中', open.length, ''],
      ['已完成', closed.length, 'ok'],
      ['搁置中', hold.length, ''],
      ['3天内到期', dueSoon.length, 'warn'],
      ['已逾期', overdue.length, 'bad'],
    ];
    el.innerHTML = tiles.map(([label, n, cls]) =>
      '<div class="stat ' + cls + '"><b class="tab">' + n + '</b><span>' + label + '</span></div>'
    ).join('');
  }

  function renderBriefing(){
    const today = todayDateOnly();
    document.getElementById('briefDate').textContent = today.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric', weekday:'long'});

    const dueToday = allTasks.filter(t => t.status !== 'Closed' && parseISO(t.dueDate) && daysBetween(today, parseISO(t.dueDate)) === 0);
    const dueTomorrow = allTasks.filter(t => t.status !== 'Closed' && parseISO(t.dueDate) && daysBetween(today, parseISO(t.dueDate)) === 1);
    const overdue = allTasks.filter(t => t.status !== 'Closed' && parseISO(t.dueDate) && daysBetween(today, parseISO(t.dueDate)) < 0);
    const closedThisWeek = allTasks.filter(t => t.status === 'Closed');

    let lines = [];
    lines.push('【Durability Workshop 督办日报】' + today.toLocaleDateString('zh-CN'));
    lines.push('');
    if(dueToday.length){
      lines.push('🔴 今日要关闭：');
      dueToday.forEach(t => lines.push('  ' + t.ref + ' ' + biDesc(t) + '（负责人：' + (t.owner||'—') + '）'));
      lines.push('');
    }
    if(dueTomorrow.length){
      lines.push('🟡 明日到期提醒：');
      dueTomorrow.forEach(t => lines.push('  ' + t.ref + ' ' + biDesc(t) + '（负责人：' + (t.owner||'—') + '）'));
      lines.push('');
    }
    if(overdue.length){
      lines.push('⚠️ 已逾期，需协商新截止日期：');
      overdue.forEach(t => lines.push('  ' + (t.ref||'') + ' ' + biDesc(t) + '（原定 ' + (t.dueDate||'—') + '，负责人：' + (t.owner||'—') + '）'));
      lines.push('');
    }
    if(!dueToday.length && !dueTomorrow.length && !overdue.length){
      lines.push('今日无到期 / 逾期任务。');

  function taskCard(t){
    const bucket = dueBucket(t);
    const isClosed = t.status === 'Closed';
    return '' +
    '<div class="task' + (isClosed ? ' is-closed' : '') + '" data-ref="' + t.ref + '">' +
      '<div class="ref">' + t.ref + '</div>' +
      '<div class="body">' +
        '<div class="row1"><span class="fn-tag">' + fnLabel(t.function) + '</span><span class="fn-tag proj-tag">' + (t.project==='Battery Swapping Station'?'换电站':'Tonly卡车') + '</span></div>' +
        '<div class="desc">' + escapeHtml(t.description||'') + '</div>' +
        (t.descriptionEn ? '<div class="desc-en">' + escapeHtml(t.descriptionEn) + '</div>' : '') +
        (t.action ? '<div class="action">' + escapeHtml(t.action) + '</div>' : '') +
        (t.actionEn ? '<div class="action-en">' + escapeHtml(t.actionEn) + '</div>' : '') +
        '<div class="footer"><span>负责人 <b>' + escapeHtml(t.owner||'—') + '</b></span><span>提出日 ' + (t.dateRaised||'—') + '</span></div>' +
        '<textarea class="comment-box" readonly>' + escapeHtml(t.comments||'') + '</textarea>' +
        (t.commentsEn ? '<div class="comments-en">原文：' + escapeHtml(t.commentsEn) + '</div>' : '') +
        changeLogBlock(t) +
      '</div>' +
      '<div class="side">' +
        '<span class="due ' + bucket + '">' + dueLabel(t) + '</span>' +
        '<input type="date" class="due-input" value="' + (t.dueDate||'') + '" disabled>' +
        '<select class="status-select" disabled>' +
          STATUS_OPTIONS.map(s => '<option value="' + s + '"' + (s===t.status?' selected':'') + '>' + statusLabel(s) + '</option>').join('') +
        '</select>' +
      '</div>' +
    '</div>';
  }

  function changeLogBlock(t){
    const log = Array.isArray(t.changeLog) ? t.changeLog : [];
    if(!log.length) return '';
    const rows = log.slice().reverse().map(e =>
      '<li><span class="cl-date">' + (e.date||'') + '</span> <span class="cl-arrow">' + (e.old||'—') + ' → ' + (e.new||'—') + '</span>' +
      (e.reason ? '<span class="cl-reason">' + escapeHtml(e.reason) + '</span>' : '') + '</li>'
    ).join('');
    return '<div class="changelog"><p class="cl-title">📋 延期协商记录</p><ul>' + rows + '</ul></div>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function earliestDueSort(a, b){
    const da = parseISO(a.dueDate), db_ = parseISO(b.dueDate);
    if(!da && !db_) return 0;
    if(!da) return 1;
    if(!db_) return -1;
    return da - db_;
  }

  function ownerBlocksHtml(ts){
    const byOwner = {};
    ts.forEach(t => {
      const key = t.owner || '（未指定）';
      (byOwner[key] = byOwner[key] || []).push(t);
    });

    // order owners by their most urgent open task first (earliest due date among non-closed)
    const owners = Object.keys(byOwner).sort((oa, ob) => {
      const openA = byOwner[oa].filter(t => t.status !== 'Closed').sort(earliestDueSort);
      const openB = byOwner[ob].filter(t => t.status !== 'Closed').sort(earliestDueSort);
      if(!openA.length && !openB.length) return oa.localeCompare(ob);
      if(!openA.length) return 1;
      if(!openB.length) return -1;
      return earliestDueSort(openA[0], openB[0]);
    });

    return owners.map(owner => {
      const list = byOwner[owner];
      const open = list.filter(t => t.status !== 'Closed').sort(earliestDueSort);
      const closed = list.filter(t => t.status === 'Closed').sort(earliestDueSort);
      const overdueCount = open.filter(t => dueBucket(t) === 'bad').length;

      const openHtml = open.length ? '<div class="task-list">' + open.map(taskCard).join('') + '</div>' : '';
      const closedHtml = closed.length ? (
        '<details class="closed-group">' +
          '<summary>已完成 (' + closed.length + ')</summary>' +
          '<div class="task-list">' + closed.map(taskCard).join('') + '</div>' +
        '</details>'
      ) : '';
      if(!open.length && !closed.length) return '';

      return '<div class="owner-block">' +
        '<p class="owner-title">👤 ' + escapeHtml(owner) +
          '<span class="n tab">' + open.length + ' 进行中</span>' +
          (overdueCount ? '<span class="n tab bad">' + overdueCount + ' 逾期</span>' : '') +
        '</p>' +
        openHtml + closedHtml +
      '</div>';
    }).join('');
  }

  function renderProjects(){
    const el = document.getElementById('projects');
    el.innerHTML = PROJECTS.map(proj => {
      const projTasks = allTasks.filter(t => t.project === proj);
      if(!projTasks.length) return '';
      const projOpenCount = projTasks.filter(t => t.status !== 'Closed').length;

      const orgSections = ORGS.map(org => {
        const ts = projTasks.filter(t => ownerOrg(t.owner) === org);
        if(!ts.length) return '';
        const openCount = ts.filter(t => t.status !== 'Closed').length;
        return '<div class="org-block">' +
          '<div class="org-head"><h3>' + ORG_LABELS[org] + '</h3><span class="count">' + openCount + ' 进行中 / ' + ts.length + ' 共计</span></div>' +
          ownerBlocksHtml(ts) +
        '</div>';
      }).join('');

      return '<section class="project">' +
        '<div class="project-head"><h2>' + projectLabel(proj) + '</h2><span class="count">' + projOpenCount + ' 进行中 / ' + projTasks.length + ' 共计</span></div>' +

  }

  function renderWeekAgenda(){
    const el = document.getElementById('weekAgenda');
    const today = todayDateOnly();
    const weekdayNames = ['周日','周一','周二','周三','周四','周五','周六'];
    let html = '';
    for(let i = 0; i < 7; i++){
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = i === 0;
      const dueList = allTasks.filter(t => {
        if(t.status === 'Closed') return false;
        const due = parseISO(t.dueDate);
        return due && daysBetween(d, due) === 0;
      });
      const chips = dueList.slice(0, 4).map(t =>
        '<div class="chip ' + dueBucket(t) + '">' + (t.ref||'') + ' ' + escapeHtml((t.description||'').slice(0,10)) + '</div>'
      ).join('');
      const more = dueList.length > 4 ? '<div class="none">+' + (dueList.length - 4) + ' 更多</div>' : '';
      const body = dueList.length ? (chips + more) : '<div class="none">无到期</div>';
      html +=
        '<div class="day' + (isWeekend?' weekend':'') + (isToday?' today':'') + '">' +
          '<div class="dlabel"><span>' + (isToday ? '今天' : weekdayNames[d.getDay()]) + '</span>' + (isWeekend?'<span>周末</span>':'') + '</div>' +
          '<div class="dnum tab">' + (d.getMonth()+1) + '/' + d.getDate() + '</div>' +
          '<div class="chips">' + body + '</div>' +
        '</div>';
    }
    el.innerHTML = html;
  }

  function startOfWeek(d){
    const day = d.getDay(); // 0=Sun..6=Sat
    const diffToMon = (day === 0 ? -6 : 1 - day);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToMon);
  }

  function renderWeekReport(){
    const today = todayDateOnly();
    const monday = startOfWeek(today);
    const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
    document.getElementById('weekRangeLabel').textContent =
      '本周 ' + (monday.getMonth()+1) + '/' + monday.getDate() + ' – ' + (sunday.getMonth()+1) + '/' + sunday.getDate();

    const lines = [];
    lines.push('【Durability Workshop 周度完成情况】' + (monday.getMonth()+1) + '/' + monday.getDate() + ' - ' + (sunday.getMonth()+1) + '/' + sunday.getDate());
    lines.push('');

    PROJECTS.forEach(p => {
      const ts = allTasks.filter(t => t.project === p);
      const closed = ts.filter(t => t.status === 'Closed');
      const closedThisWeek = closed.filter(t => {
        if(!t.closedAt) return false;
        const d = toDateOnly(new Date(t.closedAt));
        return d >= monday && d <= sunday;
      });
      const overdue = ts.filter(t => t.status !== 'Closed' && dueBucket(t) === 'bad');
      const inProgress = ts.filter(t => t.status !== 'Closed' && dueBucket(t) !== 'bad');
      const hold = ts.filter(t => t.status === 'On hold');

      lines.push('▍' + p);
      lines.push('  进行中 ' + inProgress.length + ' / 逾期(延期) ' + overdue.length + ' / 搁置 ' + hold.length + ' / 累计完成 ' + closed.length + '（共 ' + ts.length + ' 项）');
      if(closedThisWeek.length){
        lines.push('  本周新完成：');
        closedThisWeek.forEach(t => lines.push('    ✓ ' + t.ref + ' ' + t.description));
      }
      if(overdue.length){
        lines.push('  逾期待协商变更：');
        overdue.forEach(t => lines.push('    ⚠ ' + t.ref + ' ' + t.description + '（原定 ' + (t.dueDate||'—') + '，' + (t.owner||'—') + '）'));
      }
      lines.push('');
    });

    document.getElementById('weekText').textContent = lines.join('\n');
  }

        const old = btn.textContent;
        btn.textContent = '已复制 ✓';
        setTimeout(() => btn.textContent = old, 1400);
      }).catch(() => {});
